services:
  - type: web
    name: weathertwin-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python data/generate_data.py && python data/generate_rules.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
